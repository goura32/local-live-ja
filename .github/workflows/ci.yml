name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lightweight:
    name: Hardware-free checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync development dependencies
        run: uv sync --frozen --extra dev
      - name: Run hardware-free tests
        run: uv run pytest -m "not hardware and not integration"
      - name: Compile Python sources
        run: uv run python -m compileall -q src tests
      - name: Build wheel and sdist
        run: uv build
      - name: Check whitespace errors
        run: git diff --check

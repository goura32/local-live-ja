# 実利用向け構成。Phase 4/5の診断既定値はdefault.yamlに保持する。
app:
  artifact_dir: results/artifacts
  result_dir: results
  language: Japanese
  sample_rate: 16000
  channels: 1

asr:
  model: large-v3-turbo
  language: ja
  gpu_compute_candidates: [float16, int8_float16]
  gpu_default_compute_type: int8_float16
  cpu_compute_type: int8
  beam_size: 5

llm:
  local_base_url: http://127.0.0.1:11434
  local_model: qwen3.5:9b-q4_K_M
  openrouter_base_url: https://openrouter.ai/api/v1
  openrouter_model: openrouter/free
  num_ctx: 8192
  max_tokens: 96
  openrouter_max_tokens: 384
  temperature: 0.2

tts:
  backend: vllm_omni
  model: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
  speaker: Ono_Anna
  language: Japanese
  device: auto
  cpu_reference: true
  max_new_tokens: 2048
  generation_kwargs:
    do_sample: true
    top_k: 50
    top_p: 1.0
    temperature: 0.9
    repetition_penalty: 1.05
    subtalker_dosample: true
    subtalker_top_k: 50
    subtalker_top_p: 1.0
    subtalker_temperature: 0.9
    max_new_tokens: 2048
  sentence_max_chars: 48
  sentence_timeout_s: 0.8
  safe_trim_enabled: true
  safe_trim_pre_roll_s: 0.05
  vllm_base_url: http://127.0.0.1:8091/v1
  vllm_host: 127.0.0.1
  vllm_port: 8091
  vllm_python: auto
  vllm_timeout_s: 300.0
  vllm_server_start_timeout_s: 900.0
  vllm_gpu_memory_utilization: null
  vllm_streaming: true
  vllm_initial_codec_chunk_frames: null
  vllm_use_flashinfer_sampler: false

bench:
  phase7_application_turns: 60

# chat固有の境界値。音量・AEC thresholdはdefault.yamlと同じ固定値を使う。
chat:
  history_max_turns: 12
  history_max_chars: 8000
  min_speech_duration_s: 0.12
  end_silence_s: 0.12
  max_utterance_duration_s: 8.0
  vad_threshold: 0.015
  vad_noise_multiplier: 3.0
  microphone_block_ms: 20
  read_timeout_s: 0.1
  max_retries: 1

echo_rejection:
  correlation_threshold: 0.9642105263
  residual_energy_ratio_threshold: 0.9
  max_lag_s: 0.066
  energy_ratio_min: 0.1416587676
  energy_ratio_max: 0.4389911740
  window_s: 0.08
  hop_s: 0.04
  vad_threshold: 0.015
  calibrated_from: results/bench_echo_rejection.json

pipewire:
  microphone: auto
  speaker: auto
  echo_cancel_sink: Local Live Echo Cancellation Sink
  echo_cancel_source: Local Live Echo Cancellation Source
  echo_cancel_capture: Local Live Echo Cancellation Capture
  echo_cancel_playback: Local Live Echo Cancellation Playback
  aec_library: aec/libspa-aec-webrtc
  node_latency: 1024/48000

credentials:
  openrouter_file: ~/.config/credstore/openrouter.key
